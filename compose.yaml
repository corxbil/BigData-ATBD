name: bigdata-atbd

services:

  master:
    image: atbd-hadoop:1.0
    container_name: atbd-master
    hostname: master
    command: ["sleep", "infinity"]
    networks:
      - atbd-network
    volumes:
      - atbd-namenode:/data/hadoop/namenode
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

  worker1:
    image: atbd-hadoop:1.0
    container_name: atbd-worker1
    hostname: worker1
    command: ["sleep", "infinity"]
    networks:
      - atbd-network
    volumes:
      - atbd-datanode1:/data/hadoop/datanode
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

  worker2:
    image: atbd-hadoop:1.0
    container_name: atbd-worker2
    hostname: worker2
    command: ["sleep", "infinity"]
    networks:
      - atbd-network
    volumes:
      - atbd-datanode2:/data/hadoop/datanode
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

  worker3:
    image: atbd-hadoop:1.0
    container_name: atbd-worker3
    hostname: worker3
    command: ["sleep", "infinity"]
    networks:
      - atbd-network
    volumes:
      - atbd-datanode3:/data/hadoop/datanode
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

  client:
    image: atbd-spark:1.0
    container_name: atbd-client
    hostname: client
    command: ["sleep", "infinity"]
    networks:
      - atbd-network
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

networks:
  atbd-network:
    external: true
    name: atbd-network

volumes:
  atbd-namenode:
    external: true
  atbd-datanode1:
    external: true
  atbd-datanode2:
    external: true
  atbd-datanode3:
    external: true
